context:
  version: "1.15.2"

package:
  name: hereby
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/hereby/-/hereby-${{ version }}.tgz
  sha256: b55719c99cc21bb8958519968ad5b391545115c9875c2762ef9e9a6ea580c1f7

build:
  number: 0
  noarch: generic

requirements:
  build:
    - jq
    - nodejs
    - pnpm
    - pnpm-licenses
  run:
    - nodejs

tests:
  - script:
      - hereby --help

about:
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: A simple Node.js task runner
  homepage: https://github.com/jakebailey/hereby
  repository: https://github.com/jakebailey/hereby

extra:
  recipe-maintainers:
    - danielnachun
